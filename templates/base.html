<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eae5dc">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ meta_description }}">
  <meta name="robots" content="index,follow,max-image-preview:large">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}">{% endif %}
  <meta property="og:site_name" content="다빈치 가이드">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:type" content="{{ og_type|default('website') }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ meta_description }}">
  {% if canonical %}<meta property="og:url" content="{{ canonical }}">{% endif %}
  <link rel="icon" type="image/png" sizes="48x48" href="{{ root }}assets/icons/favicon-48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ root }}assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="{{ root }}assets/style.css">
  <link rel="stylesheet" href="{{ root }}assets/icons.css">
  <script>window.DG_ROOT = {{ root|tojson }};</script>
  <script src="{{ root }}assets/data.js" defer></script>
  <script src="{{ root }}assets/app.js" defer></script>
  {% if jsonld %}<script type="application/ld+json">{{ jsonld|tojson }}</script>{% endif %}
</head>
<body class="{{ body_class|default('') }}">
  <a class="skip-link" href="#main">본문으로 바로가기</a>
  <header class="site-header container">
    <a class="brand" href="{{ root }}index.html" aria-label="다빈치 가이드 홈">
      <img class="brand-app-icon" src="{{ root }}assets/icons/davinci.webp" width="36" height="36" alt="">
      <span class="brand-name">다빈치 가이드</span>
    </a>
    <nav class="top-nav" aria-label="주요 메뉴">
      <a class="{{ 'is-current' if active_nav=='programs' else '' }}" href="{{ root }}index.html#choose">프로그램별 가이드</a>
      <a class="{{ 'is-current' if active_nav=='dictionary' else '' }}" href="{{ root }}dictionary/">기능 사전 <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left"><img class="footer-app-icon" src="{{ root }}assets/icons/davinci.webp" width="57" height="57" alt=""><span>편집은 익숙하게.<br>다빈치는 새롭게.</span></div>
      <div class="footer-right"><a href="{{ root }}dictionary/">기능 사전</a><a href="{{ root }}index.html#choose">프로그램별 가이드</a><span>다빈치 리졸브 21.1 기준 · 메뉴와 지원 범위는 버전마다 다를 수 있습니다.</span><small>다빈치 가이드 · 블하TV를 위한 시안</small></div>
    </div>
  </footer>
</body>
</html>
